name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          TAG="${{ github.ref_name }}"
          # Validate semantic version format (vX.Y.Z)
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag '$TAG' does not match semantic version format vX.Y.Z"
            echo "Valid formats: v1.0.0, v2.1.0, v10.20.30"
            exit 1
          fi
          # Extract version components
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "Version: $TAG (Major: $MAJOR, Minor: $MINOR, Patch: $PATCH)"
          # Validate version components are non-negative integers
          if [[ $MAJOR -lt 0 || $MINOR -lt 0 || $PATCH -lt 0 ]]; then
            echo "ERROR: Version components must be non-negative integers"
            exit 1
          fi
          echo "✓ Tag validation passed"

  verify:
    needs: [validate-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test Race
        env:
          CGO_ENABLED: 1
        run: go test -cpu="1,4" -short -race -v ./...

      - name: fmt
        run: diff <(gofmt -d .) <(printf "")

  semantic-riscv:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      ASMFMT_AS: riscv64-linux-gnu-as
      ASMFMT_OBJDUMP: riscv64-linux-gnu-objdump
      ASMFMT_ASFLAGS: -march=rv64gc -mabi=lp64d
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install RISC-V binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-riscv64-linux-gnu

      - name: Semantic Equivalence
        run: go test -run TestOptionalSemanticEquivalence -v ./...

  goreleaser:
    needs: [verify, semantic-riscv]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Check for custom release notes
        id: custom_notes
        run: |
          NOTE_FILE="docs/release_notes_${{ github.ref_name }}.md"
          if [ -f "$NOTE_FILE" ]; then
            echo "Found custom release notes: $NOTE_FILE"
            echo "args=release --clean --release-notes=$NOTE_FILE" >> $GITHUB_OUTPUT
          else
            echo "No custom release notes found, using default changelog."
            echo "args=release --clean" >> $GITHUB_OUTPUT
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: ${{ steps.custom_notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 0
