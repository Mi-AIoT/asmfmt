name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', '1.26.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: 0
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    - name: Test Config Features
      run: go test -run 'TestCLIConfig|TestConfigResolver|TestFormatWithOptions|TestParseOptionsTOML' ./...

    - name: Test Race
      env:
        CGO_ENABLED: 1
      run: go test -cpu="1,4" -short -race -v ./...

  build-special:
    env:
      CGO_ENABLED: 0
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Clean non-v tags
      run: |
        git tag | grep -v "^v" | xargs git tag -d || true

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.x'
        cache: true

    - name: fmt
      run: diff <(gofmt -d .) <(printf "")

    - name: Test 386
      run: GOOS=linux GOARCH=386 go test ./...

    - name: GoReleaser check
      uses: goreleaser/goreleaser-action@v6
      with:
        version: '~> v2'
        args: check

    - name: GoReleaser snapshot
      uses: goreleaser/goreleaser-action@v6
      with:
        version: '~> v2'
        args: release --snapshot --clean

    - name: Upload snapshot artifacts
      uses: actions/upload-artifact@v4
      with:
        name: asmfmt-snapshot-${{ github.sha }}
        path: dist/*
        if-no-files-found: error
        retention-days: 14

  semantic-riscv:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      ASMFMT_AS: riscv64-linux-gnu-as
      ASMFMT_OBJDUMP: riscv64-linux-gnu-objdump
      ASMFMT_ASFLAGS: -march=rv64gc -mabi=lp64d
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.x'
        cache: true

    - name: Install RISC-V binutils
      run: sudo apt-get update && sudo apt-get install -y binutils-riscv64-linux-gnu

    - name: Semantic Equivalence
      run: go test -run TestOptionalSemanticEquivalence -v ./...

  deploy-beta:
    name: Deploy Beta Release
    needs: [build, build-special, semantic-riscv]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: beta-release
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download snapshot artifacts
        uses: actions/download-artifact@v4
        with:
          name: asmfmt-snapshot-${{ github.sha }}
          path: dist

      - name: Update Beta Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f beta
          git push -f origin beta

      - name: Release Beta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: "Beta / Nightly Build"
          body: |
            This is an automated pre-release build of the `master` branch.

            It is automatically built and updated on every successful commit to `master`.

            **Commit:** ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
